<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>Couter 0</button>
</body>
<script>
    let btn = document.getElementsByTagName('button')[0];
    btn.onclick = () => {
        let countVal =  +(btn.innerHTML.split(' ')[1]) + 1;
        btn.innerHTML = 'Counter ' + countVal;
    }
</script>
</html>
