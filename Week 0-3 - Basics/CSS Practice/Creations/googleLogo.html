<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            margin: auto;
        }
        .card > h1{
            margin: 0px auto;
            height:400px;
            width: 400px;
            background-color: aqua;
            background-image: conic-gradient(from 80deg at 40% 60%, red 0deg, red 90deg, blue 90deg, blue 180deg, green 180deg, green 270deg, yellow 270deg);

            font-size: 30em;
            margin-top: 20px;
            padding-bottom: 140px;
            font-family:sans-serif;
            font-weight:800;

            -webkit-background-clip: text;
            color: transparent;
        }
        
    </style>
</head>
<body>
    <div class="card">
        <h1>G</h1>
    </div>
</body>
</html>
