<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin: 0%;
            padding: 0%;
        }

        .box{
            background-color: rgb(78, 37, 117);
            width: 50%;
            height: 400px;
            margin: 0 auto;
            border: 3px solid red;
            background-image: url("cat.webp");
            background-size: cover;
            background-position: 70%;
            background-blend-mode: multiply;
            background-repeat: no-repeat;

            display: grid;
            text-align: center;
            align-items: center;
        }

        .cat{
            color: #f0f8ff;
            font-size: 60px;
        }
    </style>

</head>
<body>
    <div class="box">
        <p class="cat">
            Cats
        </p>
    </div>
</body>
</html>
