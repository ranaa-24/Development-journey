<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #ele{
      height: 100px;
      aspect-ratio: 1;
      background-color: black;
    }
  </style>
</head>
<body>
  <div id="ele"></div>

  <script>
    function Random(range){
      return Math.random() * (range+1);
    }
    ele.onmousemove = function(event){

      document.getElementsByTagName('body')[0].style.backgroundColor = `rgb(${Random(255)}, ${Random(255)}, ${Random(255)})`;
      

    }
  </script>
</body>
</html>
