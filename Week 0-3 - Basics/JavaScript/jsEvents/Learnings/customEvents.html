      // console.log(elem.dispatchEvent(event1));  // it will generate a event called 'myEvent' and that event will hadled by document

      function hide() {
        let event = new Event("hide", { cancelable: true });

        // .dispatchEvent will return false if .preventDefault get called
        if (!rabbit.dispatchEvent(event)) {
          alert("Action Prevented..!");
        } else {
          rabbit.hidden = true;
        }
      }

      rabbit.addEventListener("hide", (e) => {
        if (confirm("miss clicked? Wanna prevent your action..?")) {
          e.preventDefault();
        }
      });
    </script>
