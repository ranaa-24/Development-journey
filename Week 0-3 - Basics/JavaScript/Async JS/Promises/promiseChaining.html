       //------------------- Promise Chaining ----------------------

       function change(element, text, color, time){
            return new Promise(function(resolve, reject){
                setTimeout(() => {
                    if(element){                    
                        element.textContent = text;
                        element.style.color = color;
                        resolve();
                    }
                    else{
                        reject();
                    }
                }, time);
            })
       }
