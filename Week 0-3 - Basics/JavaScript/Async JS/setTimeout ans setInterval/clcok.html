<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="clock"></h1>
</body>
<script>
    let clock = document.getElementById("clock");
    clock.style.textAlign = "center";
    setInterval(() => {
        clock.innerHTML = new Date().toLocaleTimeString();
    }, 1000);


</script>
</html>
