<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM learning</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="container nav" id="nav-id">
        <h1 class="logo" id="logo">Xcinlearnings</h1>
        <ul class="nav-items">
          <li><a href="#">Home</a></li>
          <li><a href="#">Todo</a></li>
          <li><a href="#">Sign Up</a></li>
        </ul>
      </nav>

      <div class="headline">
        <h2>Manage your task, We'll manage your life.</h2>
        <button class="btn">Explore</button>
      </div>
    </header>

    <section class="todo-section">
      <div class="container">
        <h2>Whats your plan for today?</h2>
      <form action="" class="todo-task">
        <input type="text" name="" id="" placeholder="Task" />
        <input type="submit" value="Add Todo" class="add-btn">
      </form>

      <img src="girl-gif.gif" alt="hii" class="popUp">
      </div>
    </section>

    <section class="signUp">
      <div class=" wrapper container">
          <div class="SignUpBox">
            <h2>Sign Up</h2>
            <form class="signUpForm">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" placeholder="xyz@gmail.com">
              <label for="pass">Password</label>
              <input type="password" name="pass" id="pass">
              <input type="button" value="Create Acount" class="btn sbtn">
            </form>
          </div>
      </div>
    </section>

  </body>
</html>
